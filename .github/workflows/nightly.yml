name: Nightly real-site regression

# 每天跑一遍真实站点，尽早发现"站点改版 / 我们的链路退化"。
# 1) demo.py：覆盖三类页面的可用性冒烟，全部失败视为整条链路故障。
# 2) bench_sites.py：分层站点集的质量基准，通过率低于阈值时开 issue，
#    结果以 Markdown/JSON 工件留档，便于对比历史。
on:
  schedule:
    - cron: "0 16 * * *" # UTC 16:00 = 北京时间次日 00:00
  workflow_dispatch:
    inputs:
      scope:
        description: "抓取范围：nightly = 夜间回归子集，all = 全量站点集（扩容后校验用）"
        type: choice
        options:
          - nightly
          - all
        default: nightly

permissions:
  contents: read
  issues: write

jobs:
  real-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and browser
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[pdf]"
          python -m playwright install --with-deps chromium
      - name: Run demo against real sites
        id: demo
        continue-on-error: true
        run: python scripts/demo.py
      - name: Run site quality benchmark
        id: bench
        if: always()
        continue-on-error: true
        env:
          SCOPE_FLAG: ${{ inputs.scope == 'all' && '' || '--nightly' }}
        run: |
          python scripts/bench_sites.py $SCOPE_FLAG \
            --deadline-ms 45000 \
            --fail-under 0.6 \
            --json bench-sites.json \
            --md bench-sites.md
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-quality-${{ github.run_id }}
          path: |
            bench-sites.json
            bench-sites.md
          if-no-files-found: ignore
      - name: Open issue on demo failure
        if: steps.demo.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "夜间真实站点回归失败 $(date -u +%F)" \
            --body "演示站点均未取到正文，请检查抓取链路。运行日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Open issue on quality regression
        if: steps.bench.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "夜间质量基准通过率过低 $(date -u +%F)" \
            --body "分层站点集的通过率低于阈值，请查看本次运行的站点质量工件（site-quality-${{ github.run_id }}）与日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
