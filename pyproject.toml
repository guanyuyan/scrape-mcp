[project]
name = "mcp-scrape"
version = "0.21.0"
description = "反爬感知抓取 + 极省 Token 内容精简的 MCP Server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "guanyuyan" }]
keywords = ["mcp", "scraping", "web-fetch", "token-efficiency", "anti-bot", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "mcp>=2.0.0,<3",
    # mcp 依赖 pyjwt，这里显式抬下限以排除已披露的 2.14.x 漏洞（pip-audit 门禁）
    "pyjwt>=2.15.0",
    "curl_cffi>=0.7.0",
    "selectolax>=0.4.11",
    "tiktoken>=0.7.0",
    "pydantic-settings>=2.2.0",
    # L2 浏览器渲染。装完还需 playwright install chromium，
    # 或用 SCRAPE_MCP_L2_CHANNEL=chrome|msedge 复用系统浏览器
    "playwright>=1.49",
]

[project.optional-dependencies]
# PDF 文本抽取是可选能力，不装也能用其余工具，装上后 web_fetch 直接吃 PDF
pdf = ["pypdf>=6.21.2"]
# 数据集导出成 Parquet（JSONL 累积本身不需要额外依赖）
dataset = ["pyarrow>=14"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "pre-commit>=3.8",
    # 测试要覆盖 PDF 解析路径，运行时仍按可选依赖安装
    "pypdf>=6.21.2",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# RUF 的 RUF1xx 是"歧义字符"系列（字符串/文档/注释里的全角标点），
# 本项目刻意使用中文标点，整组忽略这类误报
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
per-file-ignores = {}
unfixable = []
[tool.ruff.lint.isort]
known-first-party = ["scrape_mcp"]

[tool.ruff.format]
quote-style = "double"

[project.scripts]
scrape-mcp = "scrape_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrape_mcp"]
[tool.hatch.build.targets.wheel.force-include]
"src/scrape_mcp/py.typed" = "scrape_mcp/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
# 只看抓取与抽取核心：CLI/配置/服务装配层的分支靠契约测试覆盖，不拉低门禁
source = ["src/scrape_mcp/core", "src/scrape_mcp/extract"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
