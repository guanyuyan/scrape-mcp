[project]
name = "mcp-scrape"
version = "0.29.0"
description = "反爬感知抓取 + 极省 Token 内容精简的 MCP Server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "guanyuyan" }]
keywords = ["mcp", "scraping", "web-fetch", "token-efficiency", "anti-bot", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "mcp>=2.0.0,<3",
    # mcp 依赖 pyjwt，这里显式抬下限以排除已披露的 2.14.x 漏洞（pip-audit 门禁）
    "pyjwt>=2.15.0",
    "curl_cffi>=0.7.0",
    "selectolax>=0.4.11",
    "tiktoken>=0.7.0",
    "pydantic-settings>=2.2.0",
    # L2 浏览器渲染。装完还需 playwright install chromium，
    # 或用 SCRAPE_MCP_L2_CHANNEL=chrome|msedge 复用系统浏览器
    "playwright>=1.49",
]

[project.optional-dependencies]
# PDF 文本抽取是可选能力，不装也能用其余工具，装上后 web_fetch 直接吃 PDF
pdf = ["pypdf>=6.21.2"]
# 扫描 PDF 的 OCR：pymupdf 渲染 + pytesseract 识别，另需系统安装 tesseract 与语言包
ocr = ["pymupdf>=1.24", "pytesseract>=0.3", "pillow>=10"]
# 数据集导出成 Parquet（JSONL 累积本身不需要额外依赖）
dataset = ["pyarrow>=14"]
# 示例 06 写入向量库用到的客户端；只装需要的那个即可
vector = ["chromadb>=0.5.0", "qdrant-client>=1.9.0"]
# OpenTelemetry 追踪（OTEL_ENABLED=1 时必须安装；未安装时自动退化为空操作）
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
# 分布式任务后端（JOB_BACKEND=redis 时必须安装，另起 scrape-mcp worker 消费队列）
redis = ["redis>=5.0"]
# S3 兼容对象存储（快照 / 数据集 / 任务产物启用 s3 时必须安装）
s3 = ["boto3>=1.34"]
# 第三方框架适配器；只影响 scrape_mcp.integrations 子模块
langchain = ["langchain-core>=0.3"]
llamaindex = ["llama-index-core>=0.11"]
ecosystem = ["langchain-core>=0.3", "llama-index-core>=0.11"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "pre-commit>=3.8",
    # 测试要覆盖 PDF 解析路径，运行时仍按可选依赖安装
    "pypdf>=6.21.2",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# RUF 的 RUF1xx 是"歧义字符"系列（字符串/文档/注释里的全角标点），
# 本项目刻意使用中文标点，整组忽略这类误报
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
per-file-ignores = {}
unfixable = []
[tool.ruff.lint.isort]
known-first-party = ["scrape_mcp"]

[tool.ruff.format]
quote-style = "double"

[project.scripts]
scrape-mcp = "scrape_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrape_mcp"]
[tool.hatch.build.targets.wheel.force-include]
"src/scrape_mcp/py.typed" = "scrape_mcp/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
# 只看抓取与抽取核心：CLI/配置/服务装配层的分支靠契约测试覆盖，不拉低门禁
source = ["src/scrape_mcp/core", "src/scrape_mcp/extract"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
